[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rentmont"
version = "0.1.0"
description = "Sreality rental monitor with OpenAI extraction and Telegram notifications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "openai>=2,<3",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
rentmont = "rentmont.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
